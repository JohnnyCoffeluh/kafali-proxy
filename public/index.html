<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="description" content="Remote Browser Isolation — browse the web securely through an isolated proxy" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kafali Project" />
  <title>Kafali Project — Fast Isolated Web Proxy</title>
  <link rel="stylesheet" href="style.css?v=2.2" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/><text y='.75em' x='50%' text-anchor='middle' font-size='70'>🛡️</text></svg>" />
</head>
<body>

  <!-- ── Virtual Keyboard Bridge (for Touch/Mobile Devices) ─── -->
  <input
    type="text"
    id="virtual-keyboard-bridge"
    class="virtual-keyboard-bridge"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    tabindex="-1"
    aria-hidden="true"
  />

  <!-- ── Login Overlay (Bypassed for instant open access) ───── -->
  <div id="login-overlay" style="display: none !important;" aria-hidden="true">
    <div class="login-card">
      <div class="logo">🛡️</div>
      <h1>Kafali Project</h1>
      <p>Remote Browser Isolation — Fast, Ban-Free Browsing</p>

      <form id="login-form">
        <div class="login-field">
          <input
            type="text"
            id="token-input"
            value="public"
            placeholder="Access token"
            autocomplete="off"
          />
        </div>
        <div class="login-error" id="login-error"></div>
        <button type="submit" class="btn btn-full" id="connect-btn">
          🔗 Connect
        </button>
      </form>
    </div>
  </div>

  <!-- ── Main Application ──────────────────────────────────── -->
  <div id="app" class="active">

    <!-- Top navigation bar -->
    <nav class="navbar" id="navbar">
      <!-- Row 1: Core Navigation -->
      <div class="nav-primary-row">
        <div class="brand-badge" title="Kafali Project">🛡️ Kafali</div>
        <div class="nav-btn-group">
          <button class="nav-btn" id="btn-back"  title="Back">◀</button>
          <button class="nav-btn" id="btn-fwd"   title="Forward">▶</button>
          <button class="nav-btn" id="btn-reload" title="Reload">↻</button>
        </div>

        <!-- URL input form -->
        <form id="url-form" class="url-form" action="javascript:void(0);">
          <div class="url-bar">
            <span class="lock-icon" id="lock-icon">🔒</span>
            <input
              type="text"
              id="url-input"
              placeholder="Search DuckDuckGo or enter address…"
              value="https://duckduckgo.com"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
            />
          </div>
          <!-- Go button -->
          <button type="submit" class="btn go-btn" id="btn-go">Go</button>
        </form>
      </div>

      <!-- Row 2: Responsive Toolbar & Advanced Controls -->
      <div class="nav-secondary-row">
        <!-- Device Mode Selector -->
        <div class="control-item" title="Device Viewport Mode">
          <select id="device-select" class="nav-select">
            <option value="desktop" selected>💻 Desktop (1280×800)</option>
            <option value="mobile">📱 Mobile (390×844)</option>
            <option value="tablet">📟 Tablet (820×1180)</option>
          </select>
        </div>

        <!-- Stream Quality -->
        <div class="control-item" title="Stream Quality">
          <select id="quality-select" class="nav-select">
            <option value="35">⚡ Ultra Fast (35%)</option>
            <option value="40">🎬 Smooth Video (40%)</option>
            <option value="50" selected>⚡ Fast (50%)</option>
            <option value="70">⚖️ Balanced (70%)</option>
            <option value="85">💎 Sharp (85%)</option>
          </select>
        </div>

        <!-- Live Ping Indicator -->
        <div class="ping-badge" id="ping-badge" title="Real-time roundtrip ping latency">
          ⚡ --ms
        </div>

        <!-- Soft Keyboard Trigger (Mobile/Touch) -->
        <button class="nav-action-btn" id="btn-keyboard" title="Open Touch Keyboard">
          ⌨️ Keyboard
        </button>

        <!-- NoScript / JS Toggle (Paranoid Mode) -->
        <button class="nav-action-btn" id="btn-toggle-js" title="NoScript Mode: Toggle Remote JavaScript">
          🛡️ JS: ON
        </button>

        <!-- Tor Circuit Rotation -->
        <button class="nav-action-btn" id="btn-circuit" title="Rotate Tor Circuit (New Identity)">
          🧅 New Circuit
        </button>

        <!-- Panic / Burn Session -->
        <button class="nav-action-btn btn-danger" id="btn-burn" title="Burn Session: Purge memory & rotate circuit">
          🔥 Burn
        </button>

        <!-- Connection status -->
        <div class="status-indicator" id="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">Offline</span>
        </div>
      </div>
    </nav>

    <!-- Emergency Killswitch Banner (Hidden by default) -->
    <div id="killswitch-banner" class="killswitch-banner hidden">
      <span class="killswitch-icon">🛑</span>
      <span class="killswitch-text">KILLSWITCH ENGAGED: Tor connection lost. Outbound traffic severed to protect your identity.</span>
    </div>

    <!-- Remote browser viewport -->
    <div class="viewport-container" id="viewport-container">
      <div class="viewport-placeholder" id="viewport-placeholder">
        <div class="spinner"></div>
        <span>Connecting to isolated browser via Tor…</span>
      </div>
      <canvas id="viewport" width="1280" height="800" tabindex="0"></canvas>

      <!-- Floating Type Button for Mobile / Touch Devices -->
      <button type="button" id="btn-floating-type" class="btn-floating-type" title="Type text into webpage">
        ⌨️ Type
      </button>
    </div>

    <!-- Floating / Mobile Quick Input Bar -->
    <div id="quick-input-bar" class="quick-input-bar hidden">
      <div class="quick-input-inner">
        <span class="quick-input-icon">⌨️</span>
        <input
          type="text"
          id="quick-text-input"
          placeholder="Type or paste to send to webpage (Enter sends)…"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button type="button" id="btn-quick-send" class="btn-quick-action">Send ↵</button>
        <button type="button" id="btn-quick-close" class="btn-quick-close" title="Close">✕</button>
      </div>
    </div>

    <!-- Bottom status bar -->
    <div class="status-bar">
      <span id="page-title">Ready</span>
      <span id="viewport-size">1280 × 800</span>
    </div>

  </div>

  <!-- Toast container for notifications -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js?v=2.2"></script>
</body>
</html>
